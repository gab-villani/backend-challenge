services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - backend-network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["bun", "x", "tsx", "./node_modules/@mikro-orm/cli/cli.js", "migration:up", "--config", "mikro-orm.config.ts"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: wagering
      DATABASE_USER: wagering
      DATABASE_PASSWORD: wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - backend-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: wagering
      DATABASE_USER: wagering
      DATABASE_PASSWORD: wagering
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wagering-events.fifo
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend-network

volumes:
  postgres-data:

networks:
  backend-network:
    driver: bridge